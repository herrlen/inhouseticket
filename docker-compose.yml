# Local development only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inhouseticket
      POSTGRES_PASSWORD: inhouseticket
      POSTGRES_DB: inhouseticket
    ports:
      - "5442:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inhouseticket"]
      interval: 5s
      timeout: 3s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

volumes:
  db-data:
