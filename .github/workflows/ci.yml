name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://inhouseticket:inhouseticket@localhost:5432/inhouseticket
  APP_URL: http://localhost:3100
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  MAIL_FROM: "inhouseticket <no-reply@inhouseticket.com>"
  MAIL_REPLY_TO: hello@inhouseticket.com
  SUPERADMIN_EMAILS: e2e-operator@gmail.com

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inhouseticket
          POSTGRES_PASSWORD: inhouseticket
          POSTGRES_DB: inhouseticket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inhouseticket"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations
        run: node ./node_modules/drizzle-kit/bin.cjs migrate
      - name: Database tests
        run: VITEST_DB=1 node ./node_modules/vitest/vitest.mjs run
      - run: pnpm build
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inhouseticket
          POSTGRES_PASSWORD: inhouseticket
          POSTGRES_DB: inhouseticket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inhouseticket"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Migrations
        run: node ./node_modules/drizzle-kit/bin.cjs migrate
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  image:
    # Production image for every green main commit: ghcr.io/herrlen/inhouseticket:sha-<sha>.
    # Deploying stays a deliberate step (scripts/deploy.sh).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=sha-${{ github.sha }}
          tags: |
            ghcr.io/herrlen/inhouseticket:sha-${{ github.sha }}
            ghcr.io/herrlen/inhouseticket:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
